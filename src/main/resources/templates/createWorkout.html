<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Workout - Fitness App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: url('https://img.freepik.com/free-photo/woman-helping-man-gym_23-2149314079.jpg?t=st=1724830000~exp=1724833600~hmac=6a6c38ee520ec62fa99f1b5ab1d5fa19b4c0e5e27f540f5f2786dd2b1f38d7e4&w=996') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.6); /* dark transparent overlay */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .card {
            background: rgba(255, 255, 255, 0.9); /* semi-transparent white */
            border: none;
            border-radius: 15px;
            transition: transform 0.3s ease-in-out;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }
        .navbar {
            background-color: rgba(0, 0, 0, 0.8) !important;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        body {
            padding-top: 56px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
            <i class="fa-solid fa-dumbbell me-2"></i> FitnessApp
        </a>
    </div>
</nav>

<div class="overlay">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="card shadow-lg p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="fas fa-plus-circle fa-3x text-primary mb-3"></i>
                            <h2 class="card-title fw-bold">Create a New Workout</h2>
                            <p class="card-text text-muted">Enter the details of your workout below.</p>
                        </div>
                        
                        <!-- The form binds to the "workout" object and will POST to /workout/create -->
                        <form th:action="@{saveworkout}" th:object="${workout}" method="post">
                            
                            <div class="mb-3">
                                <label for="type" class="form-label">Workout Type</label>
                                <select id="type" th:field="*{type}" class="form-select rounded-3" required>
                                    <option value="">Select a workout type</option>
                                    <option value="Cardio">Cardio</option>
                                    <option value="Strength Training">Strength Training</option>
                                    <option value="Flexibility">Flexibility</option>
                                    <option value="HIIT">HIIT</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="duration" class="form-label">Duration (in minutes)</label>
                                <input type="number" 
                                       class="form-control rounded-3" 
                                       id="duration" 
                                       th:field="*{duration}" 
                                       placeholder="Enter workout duration" 
                                       min="1"
                                       required>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill">Save Workout</button>
                                <a href="homee" class="btn btn-outline-secondary btn-sm rounded-pill mt-2">Back to Home</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
