<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Goal - Fitness App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: url('https://img.freepik.com/free-photo/handsome-young-muscular-sportsman-with-towel-and-water-bottle-standing-gym_482253-1560.jpg?t=st=1724830100~exp=1724833700~hmac=62174c3e39c4a833503f19a0a09e0a6d0c5a319f6a27e7d9b9f3f9f7d23a6774&w=996') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.6); /* dark transparent overlay */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .card {
            background: rgba(255, 255, 255, 0.9); /* semi-transparent white */
            border: none;
            border-radius: 15px;
            transition: transform 0.3s ease-in-out;
            width: 100%;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }
        .navbar {
            background-color: rgba(0, 0, 0, 0.8) !important;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        body {
            padding-top: 56px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
            <i class="fa-solid fa-dumbbell me-2"></i> FitnessApp
        </a>
    </div>
</nav>

<div class="overlay">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="card shadow-lg p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="fas fa-bullseye fa-3x text-primary mb-3"></i>
                            <h2 class="card-title fw-bold">Create a New Goal</h2>
                            <p class="card-text text-muted">Set your fitness targets.</p>
                        </div>
                        
                        <!-- The form binds to the "goal" object and will POST to /goal/create -->
                        <form th:action="@{savegoal}" th:object="${goal}" method="post">
                            
                            <div class="mb-3">
                                <label for="calToBeBurn" class="form-label">Calories to Burn</label>
                                <input type="number" 
                                       class="form-control rounded-3" 
                                       id="calToBeBurn" 
                                       th:field="*{calToBeBurn}" 
                                       placeholder="Enter your target calories" 
                                       min="1"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="netCalBurn" class="form-label">Net Calories Burned</label>
                                <input type="number" 
                                       class="form-control rounded-3" 
                                       id="netCalBurn" 
                                       th:field="*{netCalBurn}" 
                                       placeholder="Enter net calories burned" 
                                       min="0"
                                       required>
                            </div>
                            
                            <!-- The id field is typically hidden if it's auto-generated by the database -->
                            <input type="hidden" th:field="*{id}">

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill">Save Goal</button>
                                <a href="homee" class="btn btn-outline-secondary btn-sm rounded-pill mt-2">Back to Home</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
