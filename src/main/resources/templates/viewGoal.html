<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Goals - Fitness App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: url('https://img.freepik.com/free-photo/handsome-young-muscular-sportsman-with-towel-and-water-bottle-standing-gym_482253-1560.jpg?t=st=1724830100~exp=1724833700~hmac=62174c3e39c4a833503f19a0a09e0a6d0c5a319f6a27e7d9b9f3f9f7d23a6774&w=996') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.6); /* dark transparent overlay */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .card {
            background: rgba(255, 255, 255, 0.9); /* semi-transparent white */
            border: none;
            border-radius: 15px;
            transition: transform 0.3s ease-in-out;
            width: 100%;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .navbar {
            background-color: rgba(0, 0, 0, 0.8) !important;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        body {
            padding-top: 56px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
            <i class="fa-solid fa-dumbbell me-2"></i> FitnessApp
        </a>
    </div>
</nav>

<div class="overlay">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="card shadow-lg p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="fas fa-bullseye fa-3x text-primary mb-3"></i>
                            <h2 class="card-title fw-bold">My Goals</h2>
                            <p class="card-text text-muted">Track your progress and stay motivated.</p>
                        </div>
                        
                        <div th:if="${#lists.isEmpty(goal)}" class="alert alert-info text-center">
                            You haven't set any goals yet.
                        </div>
                        <div th:unless="${#lists.isEmpty(goal)}" class="table-responsive">
                            <table class="table table-striped table-hover rounded-3 overflow-hidden">
                                <thead class="table-dark">
                                    <tr>
                                        <th scope="col">#</th>
                                        <th scope="col">Goal ID</th>
                                        <th scope="col">Target Calories</th>
                                        <th scope="col">Net Calories Burned</th>
                                        <th scope="col">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="singleGoal, stat : ${goal}">
                                        <td th:text="${stat.count}"></td>
                                        <td th:text="${singleGoal.id}"></td>
                                        <td th:text="${singleGoal.calToBeBurn}"></td>
                                        <td th:text="${singleGoal.netCalBurn}"></td>
                                        <td>
                                            <a th:href="@{goal/delete(id=${singleGoal.id})}" class="btn btn-sm btn-danger rounded-pill">
                                                <i class="fas fa-trash-can"></i> Delete
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="text-center mt-4">
                            <a href="homee" class="btn btn-outline-secondary btn-lg rounded-pill">
                                <i class="fas fa-arrow-left me-2"></i> Back to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
