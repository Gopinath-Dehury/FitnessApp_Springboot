<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: url('https://img.freepik.com/free-photo/woman-helping-man-gym_23-2149314079.jpg?t=st=1724830000~exp=1724833600~hmac=6a6c38ee520ec62fa99f1b5ab1d5fa19b4c0e5e27f540f5f2786dd2b1f38d7e4&w=996') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.6); /* dark transparent overlay */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.9); /* semi-transparent white */
            border: none;
            border-radius: 15px;
            transition: transform 0.3s ease-in-out;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="card shadow-lg p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="fas fa-dumbbell fa-3x text-primary mb-3"></i>
                            <h2 class="card-title fw-bold">Login to FitnessApp</h2>
                            <p class="card-text text-muted">Enter your details to get started.</p>
                        </div>
                        
                        <!--
                            The form binds to the "user" object passed from the controller.
                            The "th:action" attribute specifies the URL to submit the form data.
                        -->
                        <form th:action="@{login}" th:object="${user}" method="post">
                            <!-- This section displays a general error message from the controller -->
                            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                                Invalid username or password.
                            </div>
                            <div th:if="${msg}" th:text="${msg}" class="alert alert-info"></div>

                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <!--
                                    The "th:field" attribute binds this input to the "username" property
                                    of the "user" object.
                                -->
                                <input type="text" 
                                       class="form-control rounded-3" 
                                       id="username" 
                                       th:field="*{username}" 
                                       placeholder="Enter your username" 
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <!--
                                    This binds to the "password" property.
                                -->
                                <input type="password" 
                                       class="form-control rounded-3" 
                                       id="password" 
                                       th:field="*{password}" 
                                       placeholder="Enter your password" 
                                       required>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <!-- Submit button to trigger form submission -->
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill">Log In</button>
                                <a href="showRegistrationPage" class="btn btn-outline-secondary btn-sm rounded-pill mt-2">Create an Account</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
